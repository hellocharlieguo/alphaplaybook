name: Daily cron

# Replaces the Render cron job (which sits at Render's $1/mo minimum). A ~30s run
# nightly uses ~13 min/month of Actions time — well within the free allowance.

on:
  schedule:
    # 23:17 UTC = 7:17pm ET (EDT) / 6:17pm ET (EST). 1-5 = Mon-Fri only, so it never
    # fires on weekends. The code also guards against weekend runs (e.g. manual
    # triggers). Observed queue delay is 25-57 min; harmless, since TODAY is ET-based.
    - cron: '17 23 * * 1-5'
    # Backup. GitHub silently DROPS scheduled runs under load — two misses in three
    # sessions (2026-08-26, 2026-08-28). 00:47 UTC Tue-Sat is 8:47pm ET Mon-Fri, the
    # SAME ET trading day as the primary, so the ET weekday guard passes. The run
    # exits before Step 1 unless TODAY's snapshot is genuinely missing (BACKUP_RUN).
    - cron: '47 0 * * 2-6'
  workflow_dispatch: {}   # adds a "Run workflow" button for manual verification

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24   # global fetch() is built in

      - name: Install dependencies
        run: npm install

      - name: Run daily cron
        run: node server/daily-cron.cjs
        env:
          # Set only when the backup schedule fired, so daily-cron.cjs can exit
          # before Step 1 if the primary already wrote today's snapshot. Empty on
          # the primary schedule and on workflow_dispatch (full run).
          BACKUP_RUN: ${{ github.event.schedule == '47 0 * * 2-6' && '1' || '' }}
          # The code reads VITE_SUPABASE_URL || SUPABASE_URL and
          # SUPABASE_SERVICE_KEY || VITE_SUPABASE_ANON_KEY, so any unset ones are
          # simply ignored — set whichever names match your Render env.
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
